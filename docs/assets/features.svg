    <text x="270" y="138" font-size="11" fill="#8B5E3C">recoverable</text>

    <rect x="364" y="12" width="168" height="176" rx="16" fill="#fff" stroke="#D9B895"/>
    <circle cx="448" cy="52" r="18" fill="#F7EFE7" stroke="#8B5E3C"/>
