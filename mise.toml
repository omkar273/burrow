# Pin toolchain + tasks. No asdf, no .tool-versions.
# https://mise.jdx.dev

min_version = "2026.8.0"

[settings]
lockfile = true

[tools]
bun = "1"
go = "1.25"

[env]
# Project-local; does not leak into the product binary.
BURROW_ENV = "dev"

[tasks.doctor]
description = "Show the pinned toolchain"
run = "mise ls --current && bun --version"

[tasks.install]
description = "Install JS workspace dependencies"
run = "bun install"

[tasks.dev]
description = "Local agent + web (after apps exist)"
run = "bun run dev"

[tasks.test]
description = "Run tests"
run = [
  "go test ./...",
  # bun test errors out when no test files exist. apps/web is not
  # scaffolded yet; say so rather than silently passing.
  "if [ -d apps/web ]; then bun test; else echo 'skip: apps/web not scaffolded, no bun tests to run'; fi",
]

[tasks.lint]
description = "Lint"
run = [
  "go vet ./...",
  # gofmt -l exits 0 even when it lists files; fail explicitly.
  "test -z \"$(gofmt -l .)\" || { gofmt -l .; echo 'unformatted files above'; exit 1; }",
]
